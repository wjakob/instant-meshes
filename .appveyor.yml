version: 1.0.{build}
image: Visual Studio 2022
test: off
clone_folder: C:\projects\InstantMeshes
branches:
  only:
    - master
install:
  - git submodule update --init --recursive
  - cd C:\Tools\vcpkg
  - if not exist vcpkg.exe call bootstrap-vcpkg.bat -disableMetrics
  - vcpkg install eigen3:x64-windows-static glfw3:x64-windows-static
build_script:
  - cd C:\projects\InstantMeshes
  - cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE=C:/Tools/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows-static -DCMAKE_POLICY_VERSION_MINIMUM=3.5
  - cmake --build build --config Release -- /m
  - 7z a instant-meshes-windows.zip "build\Release\Instant Meshes.exe"
  - appveyor PushArtifact instant-meshes-windows.zip -FileName instant-meshes-windows.zip
deploy:
  provider: S3
  region: eu-central-1
  access_key_id: AKIAJRIZYZRNQUXO7WZA
  secret_access_key:
    secure: Vy3I/MR5NtWDTXLbHcUzS6cwCSKZa/M8JYQZwHrip7cVW50Aez239OeqpC2je9yd
  bucket: instant-meshes
  set_public: true
  folder: build\Release
